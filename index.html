<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfa & Ômega — Sistema de Gestão</title>
<!-- Favicon inline — elimina o erro 404 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0d1b3e; --navy-mid: #162247; --navy-light: #1e2f5c;
  --blue: #1a3a7a; --blue-mid: #2557b8; --blue-bright: #3b6fd4;
  --red: #c0392b; --red-bright: #e74c3c;
  --white: #ffffff; --off-white: #f4f6fb;
  --light-gray: #e8ecf5; --mid-gray: #c5cde0;
  --text-gray: #8a96b0; --text-dark: #1a2240; --text-mid: #3d4f7a;
  --success: #1a8a4a; --success-bg: #e8f5ee;
  --warning: #b86a00; --warning-bg: #fff4e0;
  --danger: #c0392b; --danger-bg: #fde8e6;
  --info: #1565c0; --info-bg: #e3f2fd;
  --sidebar-w: 240px; --header-h: 60px;
  --shadow: 0 2px 12px rgba(13,27,62,.10);
  --shadow-lg: 0 6px 32px rgba(13,27,62,.16);
  --radius: 10px; --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Barlow', sans-serif; background: var(--off-white); color: var(--text-dark); min-height: 100vh; }

/* ── AUTH ── */
#auth-screen { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.auth-box { background: var(--navy-mid); border: 1px solid var(--blue); border-radius: 16px; padding: 48px 40px; width: 380px; text-align: center; }
.auth-logo { margin-bottom: 32px; }
.gear-icon { width: 64px; height: 64px; background: var(--red); clip-path: polygon(50% 0%,61% 10%,74% 6%,80% 18%,94% 20%,94% 34%,100% 42%,94% 50%,100% 58%,94% 66%,80% 68%,74% 80%,80% 92%,68% 98%,58% 90%,50% 94%,42% 90%,32% 98%,20% 92%,26% 80%,20% 68%,6% 66%,0% 58%,6% 50%,0% 42%,6% 34%,6% 20%,20% 18%,26% 6%,39% 10%); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
.auth-logo h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; color: var(--white); letter-spacing: 1px; }
.auth-logo p { font-size: 12px; color: var(--text-gray); letter-spacing: 3px; text-transform: uppercase; }
.auth-box h2 { color: var(--white); font-size: 18px; font-weight: 600; margin-bottom: 24px; }
.auth-box input { width: 100%; background: var(--navy-light); border: 1px solid var(--blue); border-radius: var(--radius-sm); padding: 12px 16px; color: var(--white); font-size: 15px; font-family: 'Barlow', sans-serif; margin-bottom: 12px; }
.auth-box input::placeholder { color: var(--text-gray); }
.auth-box input:focus { outline: none; border-color: var(--blue-bright); }
.btn-login { width: 100%; background: var(--red); color: var(--white); border: none; border-radius: var(--radius-sm); padding: 14px; font-size: 16px; font-weight: 700; font-family: 'Barlow', sans-serif; cursor: pointer; margin-top: 4px; letter-spacing: .5px; transition: background .2s; }
.btn-login:hover { background: var(--red-bright); }
.btn-login:disabled { opacity: .6; cursor: not-allowed; }
.auth-error { color: #ff6b6b; font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ── LAYOUT ── */
#app { display: none; min-height: 100vh; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; z-index: 100; }
.sidebar-logo { padding: 20px 20px 16px; border-bottom: 1px solid var(--navy-light); }
.logo-badge { display: flex; align-items: center; gap: 10px; }
.logo-gear { width: 36px; height: 36px; background: var(--red); clip-path: polygon(50% 0%,61% 10%,74% 6%,80% 18%,94% 20%,94% 34%,100% 42%,94% 50%,100% 58%,94% 66%,80% 68%,74% 80%,80% 92%,68% 98%,58% 90%,50% 94%,42% 90%,32% 98%,20% 92%,26% 80%,20% 68%,6% 66%,0% 58%,6% 50%,0% 42%,6% 34%,6% 20%,20% 18%,26% 6%,39% 10%); flex-shrink: 0; }
.logo-text h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; color: var(--white); letter-spacing: .5px; line-height: 1.2; }
.logo-text span { font-size: 10px; color: var(--text-gray); letter-spacing: 2px; text-transform: uppercase; }
.nav-menu { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 20px; cursor: pointer; transition: background .15s; color: var(--mid-gray); font-size: 14px; font-weight: 500; border-left: 3px solid transparent; }
.nav-item:hover { background: var(--navy-light); color: var(--white); }
.nav-item.active { background: var(--navy-light); color: var(--white); border-left-color: var(--red); }
.nav-item svg { flex-shrink: 0; }
.nav-section { font-size: 10px; color: var(--text-gray); letter-spacing: 2px; text-transform: uppercase; padding: 16px 20px 6px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--navy-light); }
.user-info { display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-mid); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--white); flex-shrink: 0; }
.user-name { font-size: 13px; color: var(--mid-gray); }
.btn-logout { font-size: 11px; color: var(--text-gray); cursor: pointer; margin-top: 2px; }
.btn-logout:hover { color: var(--red); }
.main { margin-left: var(--sidebar-w); min-height: 100vh; }
.topbar { height: var(--header-h); background: var(--white); border-bottom: 1px solid var(--light-gray); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
.topbar-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--navy); letter-spacing: .3px; }
.topbar-actions { display: flex; gap: 10px; }

/* ── BUTTONS ── */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600; transition: all .15s; text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--blue-mid); color: var(--white); }
.btn-primary:hover:not(:disabled) { background: var(--blue-bright); }
.btn-red { background: var(--red); color: var(--white); }
.btn-red:hover:not(:disabled) { background: var(--red-bright); }
.btn-outline { background: transparent; color: var(--text-mid); border: 1px solid var(--mid-gray); }
.btn-outline:hover:not(:disabled) { background: var(--light-gray); }
.btn-success { background: var(--success); color: var(--white); }
.btn-success:hover:not(:disabled) { background: #156b3a; }
.btn-danger { background: var(--danger); color: var(--white); }
.btn-danger:hover:not(:disabled) { background: var(--red-bright); }
.btn-warning { background: var(--warning); color: var(--white); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-xs { padding: 4px 9px; font-size: 12px; }

/* ── PAGES ── */
.page { padding: 28px; display: none; }
.page.active { display: block; }

/* ── CARDS ── */
.card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--light-gray); padding: 24px; box-shadow: var(--shadow); }

/* ── DASHBOARD ── */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--light-gray); padding: 20px; box-shadow: var(--shadow); }
.stat-label { font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
